name: rust-web-fullstack

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    container_name: rwf-postgres
    environment:
      POSTGRES_USER: rwf
      POSTGRES_PASSWORD: rwf_dev_password
      POSTGRES_DB: rwf_demo
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rwf -d rwf_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  live-search:
    build:
      context: .
      dockerfile: live-search.Dockerfile
    container_name: rwf-live-search
    environment:
      DATABASE_URL: postgres://rwf:rwf_dev_password@postgres:5432/rwf_demo
      RUST_LOG: info
    ports:
      - "3000:3000"
    healthcheck:
      # `wget` (busybox-static, ~few hundred KB) is installed in the runtime
      # image. `curl` is NOT installed by default — adding it would bloat
      # the slim Debian layer. We use `wget -qO-` to dump the body to
      # /dev/null; a non-2xx response causes the probe to fail.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  i18n-demo:
    build:
      context: .
      dockerfile: i18n-demo.Dockerfile
    container_name: rwf-i18n-demo
    environment:
      PORT: 3002
      RUST_LOG: info
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production gateway — requires JWT_PRIVATE_KEY_PEM / JWT_PUBLIC_KEY_PEM
  # to be passed via environment or secrets manager. Refuses to start without
  # them (settings::Settings::load() errors out on missing keys).
  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    container_name: rwf-gateway
    ports:
      - "3001:3001"
    environment:
      # Production keys must be supplied by the deployment platform
      # (secrets manager, k8s Secret, etc.). Uncomment and provide:
      # JWT_PRIVATE_KEY_PEM: "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
      # JWT_PUBLIC_KEY_PEM: "-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      live-search:
        condition: service_healthy

  # Dev gateway — ephemeral EdDSA keys, ALLOW_DEV_KEYS=1 guard engaged.
  # Use this for local exploration: `docker compose --profile dev up gateway-dev`.
  # NEVER use in production; tokens cannot survive a restart.
  gateway-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: gateway.Dockerfile
    container_name: rwf-gateway-dev
    ports:
      - "3001:3001"
    environment:
      ALLOW_DEV_KEYS: "1"
      ADMIN_PASSWORD: "synthetic-gateway-test-password"
      RUST_LOG: info
    command: ["/app/gateway-example", "--dev-keys"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: