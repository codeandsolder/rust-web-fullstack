name: rust-web-fullstack

services:
  postgres:
    image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    container_name: rwf-postgres
    environment:
      POSTGRES_USER: rwf
      POSTGRES_PASSWORD: rwf_dev_password
      POSTGRES_DB: rwf_demo
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rwf -d rwf_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  live-search:
    build:
      context: .
      dockerfile: live-search.Dockerfile
    container_name: rwf-live-search
    environment:
      DATABASE_URL: postgres://rwf:rwf_dev_password@postgres:5432/rwf_demo
      RUST_LOG: info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  i18n-demo:
    build:
      context: .
      dockerfile: i18n-demo.Dockerfile
    container_name: rwf-i18n-demo
    environment:
      RUST_LOG: info
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    container_name: rwf-gateway
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://rwf:rwf_dev_password@postgres:5432/rwf_demo
      JWT_PRIVATE_KEY_PEM:
      JWT_PUBLIC_KEY_PEM:
      ADMIN_PASSWORD:
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      live-search:
        condition: service_healthy

  # Local HTTP profile. Ephemeral keys and non-Secure cookies are both explicit
  # so browser session/CSRF flows work on http://localhost:3001.
  gateway-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: gateway.Dockerfile
    container_name: rwf-gateway-dev
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://rwf:rwf_dev_password@postgres:5432/rwf_demo
      ADMIN_PASSWORD: "synthetic-gateway-test-password"
      RUST_LOG: info
    volumes:
      - ./config.dev.toml:/app/config.dev.toml:ro
    command: ["/app/gateway-example", "--config", "/app/config.dev.toml", "--dev-keys"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
