when:
  - event: push
  - event: pull_request

steps:
  check-workspace:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    commands:
      - cargo check --workspace --all-targets
      - cargo check -p live-search --features ssr --all-targets
      - cargo check -p live-search --features ssr,otel --all-targets
      - rustup target add wasm32-unknown-unknown
      - cargo check -p live-search --target wasm32-unknown-unknown --features hydrate --lib
      - cargo check -p i18n-demo --features ssr --all-targets
      - cargo check -p i18n-demo --target wasm32-unknown-unknown --features hydrate --lib
    depends_on: []

  unit-tests:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    commands:
      - cargo install cargo-nextest --locked
      - cargo nextest run --workspace --lib -E 'not test(/e2e/)'
    depends_on: []

  clippy:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    commands:
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy -p live-search --features ssr --all-targets -- -D warnings
      - cargo clippy -p live-search --features ssr,otel --all-targets -- -D warnings
      - cargo clippy -p i18n-demo --features ssr --all-targets -- -D warnings
    depends_on: []

  fmt:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    commands:
      - cargo fmt --all -- --check
    depends_on: []

  audit:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    commands:
      - cargo install cargo-audit --locked
      - cargo audit --deny warnings
    depends_on:
      - fmt

  leptosfmt:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    commands:
      - cargo install leptosfmt --locked
      - find live-search i18n-demo -name '*.rs' | while read f; do leptosfmt --rustfmt --stdin --quiet < "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
      - cargo fmt --all -- --check
    depends_on:
      - fmt

  leptos-build:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    commands:
      - rustup target add wasm32-unknown-unknown
      - cargo install cargo-leptos --locked
      - cargo install stylance-cli --locked
      - cargo leptos build --release -p live-search
      - cargo leptos build --release -p i18n-demo
    depends_on:
      - clippy

  docker-build:
    image: docker:27-cli
    services:
      docker:
        image: docker:27-dind
        privileged: true
        environment:
          DOCKER_TLS_CERTDIR: ""
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    commands:
      - until docker info >/dev/null 2>&1; do sleep 1; done
      - docker build -f live-search.Dockerfile -t rwf-live-search:test .
      - docker build -f i18n-demo.Dockerfile -t rwf-i18n-demo:test .
      - docker build -f gateway.Dockerfile -t rwf-gateway:test .
    depends_on:
      - clippy

  e2e-tests:
    image: rust:1.94-bookworm@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    services:
      docker:
        image: docker:27-dind
        privileged: true
        environment:
          DOCKER_TLS_CERTDIR: ""
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
      CHROME_PATH: /usr/bin/chromium
      LIVE_SEARCH_PKG_DIR: live-search/target/site/pkg
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends chromium ca-certificates
      - rm -rf /var/lib/apt/lists/*
      - chromium --version
      - test -f "$LIVE_SEARCH_PKG_DIR/live_search.js"
      - cargo test --release --locked -p e2e-tests --tests --features browser-tests -- --test-threads=1 --nocapture
    depends_on:
      - fmt
      - audit
      - clippy
      - unit-tests
      - leptos-build
