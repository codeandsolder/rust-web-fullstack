[package]
name = "live-search"
version = "0.1.0"
edition = "2024"
# sqlx-data.json was removed — the project uses runtime query_as only.
# Compile-time query checking requires `cargo sqlx prepare`.

# dev-tools feature (console-subscriber) requires
# `RUSTFLAGS="--cfg tokio_unstable"` at build time. The Phase 2 dev Docker
# image bakes this in; for local dev, export the env var.

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "live-search"
path = "src/main.rs"
required-features = ["ssr"]

[[bench]]
name = "db_bench"
path = "benches/db_bench.rs"
harness = false
required-features = ["ssr"]

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_meta = { workspace = true }
leptos_axum = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
# Shared (wasm32 + native) UI / utility dependencies
leptos-use = { workspace = true }
leptos-struct-table = { workspace = true }
lepticons = { workspace = true }
stylance = { workspace = true }
# Shared domain types — no platform-specific dependencies, available everywhere.
rwf-domain = { workspace = true }

# leptos-forms-rs server-function config — enables the typed form pattern
leptos-forms-rs = { version = "1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower-http = { workspace = true, features = ["trace", "fs"] }
thiserror = { workspace = true }
axum-prometheus = { workspace = true }
moka = { workspace = true }
leptos-forms-rs = { version = "1", features = ["ssr"] }
base64 = { workspace = true }
rwf-config = { path = "../crates/config" }
leptos-utils = { workspace = true }
# OTel stack — gated behind `otel` feature.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
axum-tracing-opentelemetry = { workspace = true, optional = true }
# Kept optional for a future dependency refresh. sqlx-otel 0.3 is not part of
# the active `otel` feature because it targets SQLx 0.8 while this workspace
# uses SQLx 0.9. Upgrade it and Cargo.lock together before enabling DB spans.
sqlx-otel = { workspace = true, optional = true }
# Dev tools — gated behind `dev-tools` feature
console-subscriber = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
gloo-net = { workspace = true }
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
leptos-forms-rs = { version = "1", features = ["hydrate"] }
rwf-domain = { workspace = true }

[features]
default = []
ssr = ["dep:leptos_axum", "leptos/ssr", "leptos-use/ssr"]
hydrate = ["leptos/hydrate"]
test-seams = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:axum-tracing-opentelemetry",
]
dev-tools = ["dep:console-subscriber"]

[dev-dependencies]
criterion = { workspace = true }

[package.metadata.leptos]
output-name = "live-search"
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
site-pkg-dir = "pkg"
