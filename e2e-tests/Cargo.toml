[package]
name = "e2e-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]

# NOTE: `[lints] workspace = true` + pedantic override is not supported by Cargo
# (Cargo rejects mixing workspace = true with per-crate [lints.*] sections).
# We manually replicate the workspace lints with pedantic downgraded to warn
# for test code that is legitimately noisy under pedantic/nursery rules.
# clippy.toml handles unwrap_used/expect_used/panic exemptions for test code.
[lints.rust]
unsafe_code = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
too_long_first_doc_paragraph = "allow"
nursery = { level = "warn", priority = -1 }

[features]
default = []
# Browser-based tests (chromiumoxide) — gated because they require a real
# browser installation. Run with `--features browser-tests`.
browser-tests = []
# Focused runtime check for live-search's optional SQLx OpenTelemetry path.
# This enables the production `otel` feature and only the test-side tracing
# SDK pieces needed to capture and inspect emitted spans.
otel-tests = [
    "live-search/otel",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

# The test helpers live in this library crate ([lib] + src/common/) and are
# imported by each `tests/*.rs` binary. As a result, what used to be
# dev-dependencies (only visible to test binaries) are now regular dependencies
# on the library itself. Test binaries pull them in transitively through
# `e2e_tests::common::*`.
[dependencies]
# default-features = false is fine — local CDP uses plain HTTP, no TLS needed
chromiumoxide = { version = "0.9.1", default-features = false, features = ["bytes"] }
tokio = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
# Used by common::setup / common::teardown to bound the chromiumoxide handler pump.
tokio-util = { workspace = true }
serde = { workspace = true }

# Leptos + axum for in-process server function routing
leptos = { workspace = true }
leptos_axum = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }

# tower-http for optional static file serving (Leptos build artifacts)
tower-http = { workspace = true, features = ["fs"] }

# tracing for subscriber init in live_search_env
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = ["testing"] }

# Test infrastructure
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

# Snapshot testing & property-based testing
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true }

# Shared domain types (SearchResult, etc.)
rwf-domain = { workspace = true }

# Import the real SearchResult type and SSR modules for in-process server
live-search = { path = "../live-search", features = ["ssr", "test-seams"] }
# Shared Leptos axum helpers (doubled-prefix server-fn probe) for in-process
# test launchers
leptos-utils = { workspace = true }

# Gateway example for in-process HTTP tests
gateway-example = { path = "../gateway" }

# Used directly by common::json for Uuid/DateTime proptest strategies
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Anything extra that only the integration tests need (not the lib helpers).
# Currently empty — every dep that test binaries need is already a regular
# dependency, reachable through the library crate.
