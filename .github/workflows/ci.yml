name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lockfile:
    name: Lockfile consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # This temporary repair job must operate on the actual PR branch,
          # not GitHub's synthetic pull/<n>/merge ref.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Resolve manifests
        id: lockfile
        run: |
          cargo metadata --format-version 1 >/dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- Cargo.lock
          fi

      - name: Upload refreshed lockfile
        if: steps.lockfile.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
          retention-days: 1

      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request' && steps.lockfile.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh Cargo.lock"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Verify committed lockfile
        run: git diff --exit-code -- Cargo.lock

  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal \
            --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Install Leptos formatter
        run: cargo +stable install leptosfmt --locked

      - name: Generate canonical formatting
        id: format
        run: |
          cargo fmt --all
          while IFS= read -r -d '' f; do
            leptosfmt --rustfmt --stdin --quiet < "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done < <(find live-search i18n-demo -name '*.rs' -print0)
          cargo fmt --all

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only -- '*.rs' > /tmp/formatted-files.txt
            tar -czf /tmp/formatted-rust.tar.gz -T /tmp/formatted-files.txt
            git diff --stat
          fi

      - name: Upload formatter output
        if: steps.format.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: formatted-rust
          path: /tmp/formatted-rust.tar.gz
          retention-days: 1

      - name: Verify formatting
        if: steps.format.outputs.changed == 'true'
        run: git diff --exit-code

  check:
    name: Check + Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal \
            --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Workspace checks
        run: |
          cargo check --locked --workspace --all-targets
          cargo check --locked -p live-search --features ssr --all-targets
          cargo check --locked -p live-search --features ssr,otel --all-targets
          cargo check --locked -p gateway-example --features otel --all-targets
          cargo check --locked -p live-search --target wasm32-unknown-unknown --features hydrate --lib
          cargo check --locked -p i18n-demo --features ssr --all-targets
          cargo check --locked -p i18n-demo --target wasm32-unknown-unknown --features hydrate --lib

      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p live-search --features ssr --all-targets -- -D warnings
          cargo clippy --locked -p live-search --features ssr,otel --all-targets -- -D warnings
          cargo clippy --locked -p gateway-example --features otel --all-targets -- -D warnings
          cargo clippy --locked -p i18n-demo --features ssr --all-targets -- -D warnings

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal \
            --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Run library tests
        run: cargo test --locked --workspace --lib

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustc --version
          cargo --version

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked

      # Audit the exact dependency graph committed to the repository. CI must
      # not mutate Cargo.lock first: both targeted patched versions are already
      # present, and `cargo update -p` can legitimately rewrite unrelated
      # transitive edges even when the requested package version is unchanged.
      - name: Audit dependencies
        run: cargo audit

  leptos-build:
    name: Leptos production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal \
            --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Install build tools
        run: |
          cargo +stable install cargo-leptos --locked
          cargo +stable install stylance-cli --locked

      - name: Build live-search
        run: |
          cargo leptos build --release -p live-search
          mkdir -p target/site/pkg
          stylance live-search --output-file target/site/pkg/live-search.css
          find target/site/pkg -maxdepth 1 -type f -name '*.js' -size +0c -print -quit | grep -q .
          find target/site/pkg -maxdepth 1 -type f -name '*.wasm' -size +0c -print -quit | grep -q .
          test -s target/site/pkg/live-search.css

      - name: Build i18n-demo
        run: cargo leptos build --release -p i18n-demo

  docker-build:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Verify Docker
        run: docker version

      - name: Build images
        run: |
          docker build -f live-search.Dockerfile -t rwf-live-search:test .
          docker build -f i18n-demo.Dockerfile -t rwf-i18n-demo:test .
          docker build -f gateway.Dockerfile -t rwf-gateway:test .

  e2e-tests:
    name: Browser + integration E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal \
            --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustc --version
          cargo --version

      - name: Install E2E build tools
        run: |
          cargo +stable install wasm-bindgen-cli --version 0.2.126 --locked
          cargo +stable install stylance-cli --locked

      - name: Configure Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome/Chromium executable found on the GitHub-hosted runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version

      - name: Verify Docker
        run: docker version

      - name: Run E2E suite
        run: bash scripts/test-e2e.sh
