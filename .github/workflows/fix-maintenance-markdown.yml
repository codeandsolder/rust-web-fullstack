name: Fix maintenance Markdown

on:
  push:
    branches:
      - automation/maintenance-unblock-2026-09-10-z

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/maintenance-unblock-2026-09-10-z
      - run: python3 .github/fix-maintenance-markdown.py
      - name: Commit fix
        run: |
          git rm .github/fix-maintenance-markdown.py .github/workflows/fix-maintenance-markdown.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/maintenance-queue.yml
          git commit -m "fix: preserve Markdown in maintenance issue bodies"
          git push origin HEAD:automation/maintenance-unblock-2026-09-10-z
