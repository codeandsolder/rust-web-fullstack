name: Refresh coordinated lockfile

on:
  push:
    branches:
      - maintenance/telemetry-openapi-20260927
    paths:
      - Cargo.toml
      - .github/workflows/refresh-coordinated-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/telemetry-openapi-20260927
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Refresh lockfile
        run: cargo +1.98.1 metadata --format-version 1 >/dev/null
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): refresh coordinated lockfile"
          git push origin HEAD:maintenance/telemetry-openapi-20260927
