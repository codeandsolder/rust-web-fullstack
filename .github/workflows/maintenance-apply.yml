name: Maintenance apply

on:
  push:
    branches:
      - automation/maintenance-2026-09-10

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/maintenance-2026-09-10
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Refresh lockfile
        run: cargo +1.98.1 update
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m 'chore: refresh Cargo.lock after compatibility fixes'
          git push
