name: Maintenance align wasm-bindgen

on:
  push:
    branches:
      - automation/maintenance-2026-09-10

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/maintenance-2026-09-10
      - name: Align tracked wasm-bindgen CLI pins
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l '0\.2\.126' || true)
          if ((${#files[@]} == 0)); then
            echo 'No remaining 0.2.126 pins.'
            exit 0
          fi
          printf 'Updating:\n'; printf '  %s\n' "${files[@]}"
          sed -i 's/0\.2\.126/0.2.128/g' "${files[@]}"
          git diff --check
          git diff
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}"
          git commit -m 'ci: align wasm-bindgen CLI pins with lockfile'
          git push
