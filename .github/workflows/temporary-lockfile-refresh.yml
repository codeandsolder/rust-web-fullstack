name: Temporary lockfile refresh

on:
  push:
    branches:
      - automation/lockfile-2026-09-12

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/lockfile-2026-09-12
          fetch-depth: 0

      - name: Install repository Rust toolchain
        run: rustup show

      - name: Refresh lockfile
        run: cargo update

      - name: Verify lockfile resolves
        run: cargo check --locked --workspace

      - name: Commit generated lockfile and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-lockfile-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/temporary-lockfile-refresh.yml
          git diff --cached --check
          git commit -m "chore: refresh Cargo.lock"
          git push origin HEAD:automation/lockfile-2026-09-12
