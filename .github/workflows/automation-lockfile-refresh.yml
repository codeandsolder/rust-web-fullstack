name: Generate queued lockfile refresh

on:
  push:
    branches:
      - automation/lockfile-refresh-2026-09-14

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/lockfile-refresh-2026-09-14
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Refresh lockfile and commit canonical result
        shell: bash
        run: |
          set -euo pipefail
          cargo update
          git diff --check
          git status --short
          rm .github/workflows/automation-lockfile-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock .github/workflows/automation-lockfile-refresh.yml
          git commit -m 'chore: refresh Cargo.lock'
          git push origin HEAD:automation/lockfile-refresh-2026-09-14
