name: Maintenance branch writer

on:
  push:
    branches: [main]
    paths: [.github/workflows/maintenance-branch-writer.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/lockfile-2026-09-16
          fetch-depth: 0
      - name: Refresh maintenance branch
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 update
          git rm .github/workflows/maintenance-self-update.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m 'chore: refresh Cargo.lock'
          git push origin HEAD:automation/lockfile-2026-09-16
