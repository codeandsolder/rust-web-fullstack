name: Maintenance bootstrap
on:
  push:
    branches: [automation/maintenance-2026-09-22]
    paths: [.github/workflows/maintenance-bootstrap.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/maintenance-2026-09-22
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - name: Refresh lockfile
        run: cargo update
      - name: Commit generated lockfile and remove bootstrap
        run: |
          rm .github/workflows/maintenance-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/maintenance-bootstrap.yml
          git commit -m "chore: refresh Cargo.lock"
          git push
