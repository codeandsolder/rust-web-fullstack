name: Shared sccache prototype

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: shared-sccache-prototype
  cancel-in-progress: true

jobs:
  shared-cache:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@main
    with:
      command: cargo +1.98.1 test --locked --workspace --lib
      rust-toolchain: "1.98.1"
      rustflags: "-C target-cpu=x86-64-v2"
