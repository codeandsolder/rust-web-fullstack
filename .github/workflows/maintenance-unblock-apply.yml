name: Apply maintenance unblock

on:
  push:
    branches:
      - automation/maintenance-unblock-2026-09-10-z

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/maintenance-unblock-2026-09-10-z

      - name: Patch dependency wrappers out
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "Cargo.toml",
              'axum-valid = "0.25"\nvalidator = { version = "0.20", features = ["derive"] }',
              'validator = { version = "0.21", features = ["derive"] }',
          )
          replace(
              "Cargo.toml",
              'testcontainers = "0.27"\ntestcontainers-modules = { version = "0.15", features = ["postgres"] }',
              'testcontainers = "0.28"',
          )
          replace(
              "gateway/Cargo.toml",
              'axum-valid = { workspace = true }\n',
              '',
          )
          replace(
              "e2e-tests/Cargo.toml",
              'testcontainers-modules = { workspace = true }\n',
              '',
          )

          replace(
              "gateway/src/auth/handlers.rs",
              '* Public auth request payloads are typed and validated with `axum-valid`.',
              '* Public auth request payloads are typed and validated with `validator`.',
          )
          replace(
              "gateway/src/auth/handlers.rs",
              '''pub async fn login_handler(
    State(state): State<GatewayState>,
    session: tower_sessions::Session,
    axum_valid::Valid(axum::Json(LoginRequest { user_id, password })): axum_valid::Valid<
        axum::Json<LoginRequest>,
    >,
) -> Result<Json<LoginResponse>, AppError> {
    let s = &state.settings;''',
              '''pub async fn login_handler(
    State(state): State<GatewayState>,
    session: tower_sessions::Session,
    axum::Json(request): axum::Json<LoginRequest>,
) -> Result<Json<LoginResponse>, AppError> {
    request
        .validate()
        .map_err(|_| AppError::BadRequest("invalid request payload".to_string()))?;
    let LoginRequest { user_id, password } = request;
    let s = &state.settings;''',
          )
          replace(
              "gateway/src/auth/handlers.rs",
              '''pub async fn refresh_handler(
    State(state): State<GatewayState>,
    axum_valid::Valid(axum::Json(RefreshRequest { refresh_token })): axum_valid::Valid<
        axum::Json<RefreshRequest>,
    >,
) -> Result<Json<RefreshResponse>, AppError> {
    let pool = state.db_pool.as_ref().ok_or_else(|| {''',
              '''pub async fn refresh_handler(
    State(state): State<GatewayState>,
    axum::Json(request): axum::Json<RefreshRequest>,
) -> Result<Json<RefreshResponse>, AppError> {
    request
        .validate()
        .map_err(|_| AppError::BadRequest("invalid request payload".to_string()))?;
    let RefreshRequest { refresh_token } = request;
    let pool = state.db_pool.as_ref().ok_or_else(|| {''',
          )

          replace(
              "e2e-tests/src/common/db.rs",
              '''use testcontainers::runners::AsyncRunner;
use testcontainers::{ContainerAsync, ImageExt};
use testcontainers_modules::postgres::Postgres;''',
              '''use testcontainers::core::{IntoContainerPort, WaitFor};
use testcontainers::runners::AsyncRunner;
use testcontainers::{ContainerAsync, GenericImage, ImageExt};''',
          )
          replace(
              "e2e-tests/src/common/db.rs",
              'container: Box<ContainerAsync<Postgres>>,',
              'container: Box<ContainerAsync<GenericImage>>,',
          )
          replace(
              "e2e-tests/src/common/db.rs",
              '''let container = Postgres::default()
            .with_tag("17-alpine")
            .start()''',
              '''let container = GenericImage::new("postgres", "17-alpine")
            .with_exposed_port(5432.tcp())
            .with_wait_for(WaitFor::message_on_stderr(
                "database system is ready to accept connections",
            ))
            .with_wait_for(WaitFor::message_on_stdout(
                "database system is ready to accept connections",
            ))
            .with_env_var("POSTGRES_DB", "postgres")
            .with_env_var("POSTGRES_USER", "postgres")
            .with_env_var("POSTGRES_PASSWORD", "postgres")
            .start()''',
          )
          PY

      - name: Update lockfile and validate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          cargo +1.98.1 update
          cargo +1.98.1 fmt --all --check
          cargo +1.98.1 check --locked -p gateway-example -p e2e-tests --lib

      - name: Commit result and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/maintenance-unblock-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock gateway/Cargo.toml gateway/src/auth/handlers.rs e2e-tests/Cargo.toml e2e-tests/src/common/db.rs
          git commit -m "chore: unblock queued dependency upgrades"
          git push origin HEAD:automation/maintenance-unblock-2026-09-10-z
