# Explicit example configuration. Pass --config config.toml to any server.
# Omitted tables and fields use the typed defaults in crates/config.
# No credentials here: supply DATABASE_URL, JWT keys and ADMIN_PASSWORD separately.

[gateway]
port = 3001
proxy_upstream_url = "https://ipapi.co"
admin_user_id = "00000000-0000-0000-0000-000000000001"
allow_dev_keys = false
sse_broadcast_buffer = 256
refresh_token_ttl_secs = 2592000
access_token_ttl_secs = 900

[gateway.cors]
allowed_origins = "http://localhost:3000,http://localhost:3001,http://localhost:3002"

[gateway.session]
cookie_secure = true

[live_search]
port = 3000
pool_max_connections = 20
pool_min_connections = 2
pool_acquire_timeout_secs = 5
pool_idle_timeout_secs = 600
pool_max_lifetime_secs = 1800
sse_broadcast_buffer = 256

[i18n_demo]
port = 3002
