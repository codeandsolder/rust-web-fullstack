[package]
name = "gateway-example"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
otel = [
    "dep:axum-tracing-opentelemetry",
    "dep:rwf-telemetry",
]
dev-tools = ["dep:console-subscriber"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
axum-prometheus = { workspace = true }
chrono = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
jsonwebtoken = { workspace = true, features = ["use_pem"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors", "timeout", "set-header"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core", "memory-store"] }
axum-tower-sessions-csrf = "0.1"
reqwest = { workspace = true }
rwf-config = { path = "../crates/config" }
rwf-domain = { workspace = true }
tower_governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
validator = { workspace = true }
sqlx = { workspace = true }

# Optional — OTel telemetry (behind `otel` feature)
axum-tracing-opentelemetry = { workspace = true, optional = true }
rwf-telemetry = { path = "../crates/telemetry", optional = true }

# Optional — tokio-console (behind `dev-tools` feature; requires RUSTFLAGS="--cfg tokio_unstable")
console-subscriber = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "auth_bench"
harness = false
